<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RATE CARD PREMIUM - ADMIN PANEL</title>
    <style>
        body {
            background-color: #071018;
            color: #ffffff;
            font-family: 'Inter', Segoe UI, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }
        .marquee-box {
            background-color: #0b192c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 30px;
            border: 1px solid #1e3a5f;
            overflow: hidden;
        }
        .profile-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #1e3a5f;
            margin: 0 auto 20px auto;
            border: 3px solid #00f2fe;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
        .card-list {
            background-color: #0b192c;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #1e3a5f;
            margin-bottom: 30px;
        }
        .card-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #162a45;
        }
        .card-item:last-child { border-bottom: none; }
        .price-text { color: #00f2fe; font-weight: bold; }
        
        /* PANEL ADMIN SELALU MUNCUL SECARA PERMANEN */
        .admin-panel {
            background-color: #112240;
            border-radius: 12px;
            padding: 30px;
            border: 2px solid #00f2fe;
            margin-top: 40px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
        }
        .admin-panel h3 {
            margin-top: 0;
            color: #00f2fe;
            border-bottom: 1px solid #1e3a5f;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #071018;
            border: 1px solid #1e3a5f;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background-color: #00f2fe; color: #071018; }
        .btn-danger { background-color: #ef4444; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Halaman Utama Tampilan Pelihat -->
        <div class="header-section">
            <div class="profile-circle" id="viewProfile">PROFILE</div>
            <h2 id="viewTitle">RATE CARD PREMIUM</h2>
            <div class="marquee-box">
                <marquee id="viewMarquee">SILAKAN CEK HARGA & INFORMASI TERBARU DI BAWAH INI</marquee>
            </div>
        </div>

        <div class="card-list">
            <div class="card-item"><span>📘 FACEBOOK</span><span class="price-text" id="p_fb">Rp 0</span></div>
            <div class="card-item"><span>📸 INSTAGRAM</span><span class="price-text" id="p_ig">Rp 0</span></div>
            <div class="card-item"><span>🎬 REELS FACEBOOK</span><span class="price-text" id="p_reels">Rp 0</span></div>
            <div class="card-item"><span>🎵 TIKTOK</span><span class="price-text" id="p_tiktok">Rp 0</span></div>
            <div class="card-item"><span>🌟 ALL SOSMED</span><span class="price-text" id="p_all">Rp 0</span></div>
        </div>

        <!-- PANEL SETTING ADMIN - KUNCI DIBUKA PERMANEN -->
        <div class="admin-panel">
            <h3>⚙️ ADMIN SETTINGS (UPDATE REAL-TIME)</h3>
            <div class="form-group">
                <label>Judul Utama Rate Card</label>
                <input type="text" id="inputTitle" value="RATE CARD PREMIUM">
            </div>
            <div class="form-group">
                <label>Teks Berjalan (Marquee)</label>
                <input type="text" id="inputMarquee" value="SILAKAN CEK HARGA & INFORMASI TERBARU DI BAWAH INI">
            </div>
            <div class="form-group"><label>Harga Facebook</label><input type="text" id="in_fb" value="Rp 0"></div>
            <div class="form-group"><label>Harga Instagram</label><input type="text" id="in_ig" value="Rp 0"></div>
            <div class="form-group"><label>Harga Reels Facebook</label><input type="text" id="in_reels" value="Rp 0"></div>
            <div class="form-group"><label>Harga TikTok</label><input type="text" id="in_tiktok" value="Rp 0"></div>
            <div class="form-group"><label>Harga All Sosmed</label><input type="text" id="in_all" value="Rp 0"></div>
            
            <div class="btn-container">
                <button class="btn btn-primary" onclick="simpanData()">💾 SIMPAN SEMUA DATA</button>
                <button class="btn btn-danger" onclick="resetData()">🔄 RESET DEFAULT</button>
            </div>
        </div>
    </div>

    <script>
        // Fungsi memuat data otomatis saat web dibuka
        function muatData() {
            if(localStorage.getItem('rc_title')) {
                document.getElementById('viewTitle').innerText = localStorage.getItem('rc_title');
                document.getElementById('inputTitle').value = localStorage.getItem('rc_title');
                
                document.getElementById('viewMarquee').innerText = localStorage.getItem('rc_marquee');
                document.getElementById('inputMarquee').value = localStorage.getItem('rc_marquee');
                
                document.getElementById('p_fb').innerText = localStorage.getItem('rc_fb');
                document.getElementById('in_fb').value = localStorage.getItem('rc_fb');
                
                document.getElementById('p_ig').innerText = localStorage.getItem('rc_ig');
                document.getElementById('in_ig').value = localStorage.getItem('rc_ig');
                
                document.getElementById('p_reels').innerText = localStorage.getItem('rc_reels');
                document.getElementById('in_reels').value = localStorage.getItem('rc_reels');
                
                document.getElementById('p_tiktok').innerText = localStorage.getItem('rc_tiktok');
                document.getElementById('in_tiktok').value = localStorage.getItem('rc_tiktok');
                
                document.getElementById('p_all').innerText = localStorage.getItem('rc_all');
                document.getElementById('in_all').value = localStorage.getItem('rc_all');
            }
        }

        // Fungsi Tombol Simpan Semua Data
        function simpanData() {
            localStorage.setItem('rc_title', document.getElementById('inputTitle').value);
            localStorage.setItem('rc_marquee', document.getElementById('inputMarquee').value);
            localStorage.setItem('rc_fb', document.getElementById('in_fb').value);
            localStorage.setItem('rc_ig', document.getElementById('in_ig').value);
            localStorage.setItem('rc_reels', document.getElementById('in_reels').value);
            localStorage.setItem('rc_tiktok', document.getElementById('in_tiktok').value);
            localStorage.setItem('rc_all', document.getElementById('in_all').value);
            
            alert('Perubahan Berhasil Disimpan!');
            location.reload(); // Refresh halaman agar pelihat langsung melihat update-nya
        }

        // Fungsi Reset Data ke Awal
        function resetData() {
            if(confirm('Apakah Anda ingin merestart semua harga ke Rp 0?')) {
                localStorage.clear();
                location.reload();
            }
        }

        // Jalankan pemuatan data saat halaman selesai dimuat browser
        window.onload = muatData;
    </script>
</body>
</html>
