<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Rate Card Admin</title>
    <!-- 1. LETAKKAN SCRIPT NETLIFY WIDGET DI SINI (DI DALAM HEAD) -->
    </script>
</head>
<body>

    <!-- STRUKTUR FORM LOGIN ANDA -->
    <div class="login-container">
        <h2>RATE CARD ADMIN</h2>
        <p>Login pengelola website</p>

        <!-- 2. PASTIKAN TAG FORM ANDA MEMILIKI ID SEPERTI INI -->
        <form id="login-form">
            
            <label>Email Admin</label>
            <!-- Ubah type="text" menjadi type="email" dan tambahkan id="login-email" -->
            <input type="email" id="login-email" required>

            <label>Password</label>
            <!-- Tambahkan id="login-password" -->
            <input type="password" id="login-password" required>

            <!-- Tambahkan id="login-btn" -->
            <button type="submit" id="login-btn">LOGIN</button>
            
        </form>
    </div>

    <!-- 3. LETAKKAN LOGIKA JAVASCRIPT DI SINI (SEBELUM TAG PENUTUP BODY) -->
    <script>
      const loginForm = document.getElementById('login-form');

      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault(); // Mencegah halaman refresh otomatis

          const email = document.getElementById('login-email').value;
          const password = document.getElementById('login-password').value;
          const button = document.getElementById('login-btn');

          button.innerText = "Memproses...";
          button.disabled = true;

          // Memanggil sistem autentikasi Netlify Identity
          netlifyIdentity.gotrue.login(email, password)
            .then(response => {
              alert("Login Berhasil! Selamat datang Admin.");
              // Alihkan ke halaman pengeditan data Anda (misal: dashboard-input.html)
              window.location.href = "/dashboard-input.html"; 
            })
            .catch(error => {
              alert("Login Gagal: " + error.message);
              button.innerText = "LOGIN";
              button.disabled = false;
            });
        });
      }
    </script>
</body>
</html>
