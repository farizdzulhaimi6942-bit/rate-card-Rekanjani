<!-- Gunakan struktur container/box bawaan template Anda agar desain hitamnya muncul kembali -->
<div class="login-box"> 
    <h2>RATE CARD ADMIN</h2>
    <p>Login pengelola website</p>

    <!-- Pastikan tag form memiliki id="login-form" -->
    <form id="login-form">
        
        <!-- Masukkan input di dalam struktur desain Anda -->
        <div class="textbox">
            <label>Email Admin</label>
            <!-- Pastikan ada id="login-email" dan type="email" -->
            <input type="email" id="login-email" placeholder="Masukkan Email Admin" required>
        </div>

        <div class="textbox">
            <label>Password</label>
            <!-- Pastikan ada id="login-password" -->
            <input type="password" id="login-password" placeholder="Masukkan Password" required>
        </div>

        <!-- Pastikan tombol memiliki id="login-btn" -->
        <button type="submit" id="login-btn" class="btn">LOGIN</button>
        
    </form>
</div>
